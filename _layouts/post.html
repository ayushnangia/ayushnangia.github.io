<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta property="og:type" content="article">
  <title>{{ page.title | escape }} · Ayush Nangia</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="/styles.css">
  {% if page.math %}<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>{% endif %}
</head>
<body>
  <main class="page writing-page">
    <a class="back-link" href="/writing/">← Writing</a>
    <article>
      <header class="post-header">
        <h1>{{ page.title | escape }}</h1>
        <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d %B %Y' }}</time>
      </header>
      <div class="prose">{{ content }}</div>
    </article>
  </main>
</body>
</html>
